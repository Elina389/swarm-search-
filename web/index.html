<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Swarm Search -- Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; }
    #app { display: flex; height: 100%; }
    #map { flex: 1; height: 100%; }

    #sidebar {
      width: 280px;
      background: #14161a;
      color: #e6e6e6;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #sidebar h1 { font-size: 16px; margin: 0 0 4px; }
    #sidebar .subtitle { font-size: 11px; color: #888; margin-bottom: 16px; }

    .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .stat-row span:last-child { font-weight: 600; }

    #coverage-bar-track {
      width: 100%; height: 8px; background: #2a2d33; border-radius: 4px;
      overflow: hidden; margin: 6px 0 16px;
    }
    #coverage-bar-fill {
      height: 100%; background: #2ecc71; width: 0%;
      transition: width 0.25s ease;
    }

    .drone-card {
      background: #1d2026; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; border-left: 3px solid #e74c3c;
    }
    .drone-card .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .drone-card .battery-track {
      width: 100%; height: 5px; background: #2a2d33; border-radius: 3px; overflow: hidden;
      margin-top: 4px;
    }
    .drone-card .battery-fill { height: 100%; transition: width 0.25s ease, background 0.25s ease; }
    .drone-card .battery-label { font-size: 11px; color: #aaa; margin-top: 2px; }

    #status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #e74c3c; margin-right: 6px;
    }
    #status-dot.connected { background: #2ecc71; }
    #status-line { font-size: 11px; color: #888; margin-top: 16px; }

    .leaflet-popup-content { font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="sidebar">
      <h1>Swarm Search</h1>
      <div class="subtitle">Live coverage over real downtown San Jose</div>

      <div class="stat-row"><span>Step</span><span id="stat-step">0 / 0</span></div>
      <div class="stat-row"><span>Coverage</span><span id="stat-coverage">0%</span></div>
      <div id="coverage-bar-track"><div id="coverage-bar-fill"></div></div>

      <div id="drone-list"></div>

      <div id="status-line"><span id="status-dot"></span><span id="status-text">connecting...</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
